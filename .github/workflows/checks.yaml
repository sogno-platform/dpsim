name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: 'Revision under test'
        required: true
        type: string
      image:
        description: 'Development image the source scan runs in'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: pre-commit/action@v3.0.1

  clean-notebook-outputs:
    name: Notebooks have no saved outputs
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0

      - name: Fail if a notebook changed by this pull request has saved outputs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NUL-separated, because this repository has paths containing spaces.
          mapfile -d '' NOTEBOOKS < <(git diff -z --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- '*.ipynb')
          if [ "${#NOTEBOOKS[@]}" -eq 0 ]; then
            exit 0
          fi
          # Assert the rule instead of stripping and diffing, so that key order does not read as an output.
          python3 - "${NOTEBOOKS[@]}" <<'PY'
          import json
          import sys

          offenders = []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as notebook:
                  cells = json.load(notebook).get("cells", [])
              for cell in cells:
                  if cell.get("cell_type") != "code":
                      continue
                  if cell.get("outputs") or cell.get("execution_count") is not None:
                      offenders.append(path)
                      break

          if offenders:
              print("Error: the following notebooks have saved outputs committed:")
              for path in offenders:
                  print(f"  {path}")
              print("")
              print("Strip outputs before committing:")
              print("")
              print("  jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace <notebook.ipynb>")
              print("")
              print("Or install the pre-commit hooks, see the Quick start section of CONTRIBUTING.md.")
              sys.exit(1)
          PY

  check-python-deps:
    name: Validate pyproject.toml extras resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.9'

      - name: Resolve all extras
        run: |
          tmpdir=$(mktemp -d)
          cp pyproject.toml "$tmpdir/"
          for extra in dev manylinux test; do
            echo "--- Resolving extra: $extra ---"
            uv pip compile --no-strip-extras --extra "$extra" "$tmpdir/pyproject.toml" -o -
          done
          rm -rf "$tmpdir"

  cpp-check:
    name: Scan Sourcecode with Cppcheck
    runs-on: ubuntu-latest
    container: ${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: true

      - name: Run cppcheck
        working-directory: ${{ github.workspace }}
        shell: bash
        id: cppcheck
        run: |
          set -o pipefail
          cppcheck --max-configs=32 -j $(nproc) --inline-suppr --error-exitcode=1 -q --enable=warning,performance,portability,information,missingInclude --std=c++17 -I dpsim/include/ -I dpsim-models/include/ -I dpsim-villas/include dpsim/src/ dpsim-models/src/ dpsim-villas/src/ 2>&1 | tee cppcheck-output.log
        continue-on-error: true

      - name: Print cppcheck errors
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "error:")

      - name: Print cppcheck warnings
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "warning:")
        continue-on-error: true

      - name: Print cppcheck performance
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "performance:")
        continue-on-error: true

      - name: Print cppcheck portability
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "portability:")
        continue-on-error: true

      - name: Print cppcheck missingInclude
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "missingInclude:")
        continue-on-error: true

      - name: Print cppcheck information
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "information:")
        continue-on-error: true

      - name: Print cppcheck notes
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "note:")
        continue-on-error: true

      - name: Archive cppcheck output
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        with:
          name: cppcheck-output
          path: cppcheck-output.log
