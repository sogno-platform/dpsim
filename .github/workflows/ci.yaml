name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: Rebuild the development container images from their Dockerfiles
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Resolve revision and images
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
      image_prefix: ${{ steps.images.outputs.prefix }}
      base_images: ${{ steps.images.outputs.base }}
      derived_images: ${{ steps.images.outputs.derived }}
      image_dev: ${{ steps.images.outputs.dev }}
      image_rocky: ${{ steps.images.outputs.rocky }}
      image_minimal: ${{ steps.images.outputs.minimal }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed image definitions
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'packaging/Shell/**'
            dev: &dev
              - *shared
              - 'packaging/Docker/Dockerfile.dev'
            rocky:
              - *shared
              - 'packaging/Docker/Dockerfile.dev-rocky'
            minimal:
              - *shared
              - 'packaging/Docker/Dockerfile.dev-minimal'
            manylinux:
              - *shared
              - 'packaging/Docker/Dockerfile.manylinux'
            release:
              - *dev
              - 'packaging/Docker/Dockerfile'
            binder:
              - *dev
              - '.binder/Dockerfile'

      - name: Resolve the revision under test
        id: ref
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Resolve the development images
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          FORCED: ${{ inputs.rebuild_images }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEV: ${{ steps.filter.outputs.dev }}
          ROCKY: ${{ steps.filter.outputs.rocky }}
          MINIMAL: ${{ steps.filter.outputs.minimal }}
          MANYLINUX: ${{ steps.filter.outputs.manylinux }}
          RELEASE: ${{ steps.filter.outputs.release }}
          BINDER: ${{ steps.filter.outputs.binder }}
        run: |
          prefix="ghcr.io/${OWNER,,}/dpsim"

          stale() {
            [ "$1" = "true" ] || [ "$FORCED" = "true" ]
          }

          queue() {
            jq -nc --argjson acc "$1" --arg image "$2" --arg file "$3" '$acc + [{image: $image, file: $file}]'
          }

          resolve() {
            if ! stale "$2"; then
              echo "sogno/dpsim:$3"
            elif [ "$SAME_REPO" = "true" ] || docker manifest inspect "$prefix/$1:$SHA" > /dev/null 2>&1; then
              echo "$prefix/$1:$SHA"
            else
              echo "::notice::$prefix/$1:$SHA is not published yet. Approve the \"Prepare Images (fork)\" run and re-run this workflow to test against it." >&2
              echo "sogno/dpsim:$3"
            fi
          }

          base='[]'
          derived='[]'
          if [ "$SAME_REPO" = "true" ]; then
            if stale "$DEV"; then base=$(queue "$base" dev packaging/Docker/Dockerfile.dev); fi
            if stale "$ROCKY"; then base=$(queue "$base" dev-rocky packaging/Docker/Dockerfile.dev-rocky); fi
            if stale "$MINIMAL"; then base=$(queue "$base" dev-minimal packaging/Docker/Dockerfile.dev-minimal); fi
            if stale "$MANYLINUX"; then base=$(queue "$base" manylinux packaging/Docker/Dockerfile.manylinux); fi
            if stale "$RELEASE"; then derived=$(queue "$derived" release packaging/Docker/Dockerfile); fi
            if stale "$BINDER"; then derived=$(queue "$derived" binder .binder/Dockerfile); fi
          fi

          {
            echo "prefix=$prefix"
            echo "base=$base"
            echo "derived=$derived"
            echo "dev=$(resolve dev "$DEV" dev)"
            echo "rocky=$(resolve dev-rocky "$ROCKY" dev-rocky)"
            echo "minimal=$(resolve dev-minimal "$MINIMAL" dev-minimal)"
          } >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare Images
    needs: [setup]
    if: ${{ needs.setup.outputs.base_images != '[]' || needs.setup.outputs.derived_images != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-images.yaml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      tag: ${{ needs.setup.outputs.tag }}
      image_prefix: ${{ needs.setup.outputs.image_prefix }}
      base_images: ${{ needs.setup.outputs.base_images }}
      derived_images: ${{ needs.setup.outputs.derived_images }}
      base_image: ${{ needs.setup.outputs.image_dev }}

  build-linux:
    name: Build Linux
    needs: [setup, prepare]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.prepare.result != 'failure' }}
    uses: ./.github/workflows/build-linux.yaml
    with:
      image_dev: ${{ needs.setup.outputs.image_dev }}
      image_rocky: ${{ needs.setup.outputs.image_rocky }}
      image_minimal: ${{ needs.setup.outputs.image_minimal }}

  build-windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yaml

  checks:
    name: Checks
    needs: [setup, prepare]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.prepare.result != 'failure' }}
    uses: ./.github/workflows/checks.yaml
    with:
      image: ${{ needs.setup.outputs.image_dev }}

  test-linux:
    name: Test
    needs: [setup, prepare, build-linux]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' }}
    uses: ./.github/workflows/test-linux.yaml
    with:
      image: ${{ needs.setup.outputs.image_dev }}
    secrets: inherit

  villas-examples:
    name: VILLAS ${{ matrix.example }}
    needs: [build-linux]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        example:
          - dpsim-mqtt
          - dpsim-mqtt-import-export
          - dpsim-mqtt-import-export-mimo
          - dpsim-file
          - mqtt-cigre-mv-pf-profiles
    uses: ./.github/workflows/run_villas_example.yaml
    with:
      compose_file_path: examples/villas/docker-compose-tests
      example_name: ${{ matrix.example }}
      continue_on_error: true

  nix:
    name: Nix
    uses: ./.github/workflows/build-nix.yaml
    secrets: inherit

  packaging-python:
    name: Packaging
    needs: [setup, prepare]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.setup.result == 'success' && needs.prepare.result != 'failure' }}
    permissions:
      contents: read
    uses: ./.github/workflows/packaging-python.yaml
    with:
      image: ${{ needs.setup.outputs.image_dev }}

  documentation:
    name: Documentation
    needs: [setup, prepare]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_name == 'master' && needs.prepare.result != 'failure' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/documentation.yaml
    with:
      image: ${{ needs.setup.outputs.image_dev }}
    secrets: inherit
