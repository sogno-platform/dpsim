name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: Rebuild the development container images from their Dockerfiles
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Resolve revision and images
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
      image_prefix: ${{ steps.images.outputs.prefix }}
      build_images: ${{ steps.images.outputs.build }}
      image_dev: ${{ steps.images.outputs.dev }}
      image_rocky: ${{ steps.images.outputs.rocky }}
      image_minimal: ${{ steps.images.outputs.minimal }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed image definitions
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'packaging/Docker/**'
              - 'packaging/Shell/**'
              - '.binder/Dockerfile'

      - name: Resolve the revision under test
        id: ref
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      # Fresh images are only reachable when the run may push to the registry, so
      # fork pull requests keep using the images published on Docker Hub.
      - name: Resolve the development images
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CHANGED: ${{ steps.filter.outputs.docker }}
          FORCED: ${{ inputs.rebuild_images }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          prefix="ghcr.io/${OWNER,,}/dpsim"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          if [ "$SAME_REPO" = "true" ] && { [ "$CHANGED" = "true" ] || [ "$FORCED" = "true" ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "dev=$prefix/dev:$SHA" >> "$GITHUB_OUTPUT"
            echo "rocky=$prefix/dev-rocky:$SHA" >> "$GITHUB_OUTPUT"
            echo "minimal=$prefix/dev-minimal:$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "dev=sogno/dpsim:dev" >> "$GITHUB_OUTPUT"
            echo "rocky=sogno/dpsim:dev-rocky" >> "$GITHUB_OUTPUT"
            echo "minimal=sogno/dpsim:dev-minimal" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare Images
    needs: [setup]
    if: needs.setup.outputs.build_images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-images.yaml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      tag: ${{ needs.setup.outputs.tag }}
      image_prefix: ${{ needs.setup.outputs.image_prefix }}

  # Kept as a top-level job so that the branch protection contexts stay the job names.
  build-linux:
    name: ${{ matrix.title }}
    needs: [setup, prepare]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.prepare.result != 'failure' }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Build dpsimpy and tests examples on Fedora Linux
            key: fedora-dpsimpy
            image: ${{ needs.setup.outputs.image_dev }}
            cmake_args: -DCIM_VERSION=CGMES_2.4.15_16FEB2016 -DCOVERAGE=ON
            targets: --target dpsimpy --target tests --target dpsimpyvillas
            artifact: build-fedora-examples-cache
          - title: Build Cxx examples on Fedora Linux
            key: fedora-examples
            image: ${{ needs.setup.outputs.image_dev }}
            cmake_args: -DCIM_VERSION=CGMES_2.4.15_16FEB2016
            targets: ''
            artifact: build-cache-examples-cpp
          - title: Build with minimal configuration on Fedora Linux
            key: fedora-minimal
            image: ${{ needs.setup.outputs.image_minimal }}
            cmake_args: -DFETCH_SPDLOG=ON
            targets: ''
            artifact: ''
          - title: Build on Rocky Linux
            key: rocky
            image: ${{ needs.setup.outputs.image_rocky }}
            cmake_args: -DFETCH_SPDLOG=ON
            targets: ''
            artifact: ''
          - title: Build on Rocky Linux using Clang
            key: rocky-clang
            image: ${{ needs.setup.outputs.image_rocky }}
            cmake_args: -DFETCH_SPDLOG=ON -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
            targets: ''
            artifact: ''
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Create Build Environment
        run: mkdir -p build

      - name: Install ccache
        shell: bash
        run: command -v ccache || dnf install -y ccache

      - name: Setup compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.key }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.key }}-

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: |
          cmake $CMAKE_ARGS \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "$GITHUB_WORKSPACE"

      - name: Build
        shell: bash
        working-directory: ${{ github.workspace }}/build
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          ccache -z
          cmake --build . $TARGETS --parallel "$(nproc)"
          ccache -s

      - name: Archive build directory
        if: matrix.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/build
          name: ${{ matrix.artifact }}-${{ github.sha }}
          retention-days: 1

  cpp-check:
    name: Scan Sourcecode with Cppcheck
    needs: [setup, prepare]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.prepare.result != 'failure' }}
    runs-on: ubuntu-latest
    container: ${{ needs.setup.outputs.image_dev }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run cppcheck
        working-directory: ${{ github.workspace }}
        shell: bash
        id: cppcheck
        run: |
          set -o pipefail
          cppcheck --max-configs=32 -j $(nproc) --inline-suppr --error-exitcode=1 -q --enable=warning,performance,portability,information,missingInclude --std=c++17 -I dpsim/include/ -I dpsim-models/include/ -I dpsim-villas/include dpsim/src/ dpsim-models/src/ dpsim-villas/src/ 2>&1 | tee cppcheck-output.log
        continue-on-error: true

      - name: Print cppcheck errors
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "error:")

      - name: Print cppcheck warnings
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "warning:")
        continue-on-error: true

      - name: Print cppcheck performance
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "performance:")
        continue-on-error: true

      - name: Print cppcheck portability
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "portability:")
        continue-on-error: true

      - name: Print cppcheck missingInclude
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "missingInclude:")
        continue-on-error: true

      - name: Print cppcheck information
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "information:")
        continue-on-error: true

      - name: Print cppcheck notes
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: (! cat cppcheck-output.log | grep -A 2 "note:")
        continue-on-error: true

      - name: Archive cppcheck output
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.cppcheck.outcome == 'failure' }}
        with:
          name: cppcheck-output
          path: cppcheck-output.log

  build-windows:
    name: ${{ matrix.title }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Build on Windows
            key: windows
            pybind: 'OFF'
            targets: --target dpsim --target dpsim-models
          - title: Build on Windows with Pybind
            key: windows-bindings
            pybind: 'ON'
            targets: --target dpsimpy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create build folder
        run: mkdir ${{ github.workspace }}/build

      - name: Setup build directory cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build
          key: build-${{ matrix.key }}-cache-${{ github.ref }}

      - name: Install pybind11
        if: matrix.pybind == 'ON'
        run: pip install pybind11[global]

      # TODO: Remove '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' once spdlog version has been bumped
      - name: Build DPsim
        working-directory: ${{ github.workspace }}/build
        run: |
          git describe --tags --abbrev=0 --match "v*"
          cmake -DWITH_PYBIND=${{ matrix.pybind }} -DCMAKE_POLICY_VERSION_MINIMUM="3.5" ..
          cmake --build . ${{ matrix.targets }} --parallel

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml

  test-linux:
    name: Test
    needs: [setup, prepare, build-linux]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' }}
    uses: ./.github/workflows/test-linux.yaml
    with:
      image: ${{ needs.setup.outputs.image_dev }}
    secrets: inherit

  villas-examples:
    name: Run ${{ matrix.example }} VILLASnode example
    needs: [build-linux]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        example:
          - dpsim-mqtt
          - dpsim-mqtt-import-export
          - dpsim-mqtt-import-export-mimo
          - dpsim-file
          - mqtt-cigre-mv-pf-profiles
    uses: ./.github/workflows/run_villas_example.yaml
    with:
      compose_file_path: examples/villas/docker-compose-tests
      example_name: ${{ matrix.example }}
      continue_on_error: true

  nix:
    name: Nix
    uses: ./.github/workflows/build-nix.yaml
    secrets: inherit

  packaging-python:
    name: Packaging
    needs: [setup, prepare]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.prepare.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/packaging-python.yaml
    with:
      image: ${{ needs.setup.outputs.image_dev }}

  documentation:
    name: Documentation
    needs: [setup, prepare]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_name == 'master' && needs.prepare.result != 'failure' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/documentation.yaml
    with:
      image: ${{ needs.setup.outputs.image_dev }}
    secrets: inherit
