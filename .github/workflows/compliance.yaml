name: Compliance checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-notebook-outputs:
    name: Notebooks changed by this pull request have no saved outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail if a notebook changed by this pull request has saved outputs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NUL-separated, because this repository has paths containing spaces.
          mapfile -d '' NOTEBOOKS < <(git diff -z --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- '*.ipynb')
          if [ "${#NOTEBOOKS[@]}" -eq 0 ]; then
            exit 0
          fi
          # Assert the rule instead of stripping and diffing, so that key order does not read as an output.
          python3 - "${NOTEBOOKS[@]}" <<'PY'
          import json
          import sys

          offenders = []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as notebook:
                  cells = json.load(notebook).get("cells", [])
              for cell in cells:
                  if cell.get("cell_type") != "code":
                      continue
                  if cell.get("outputs") or cell.get("execution_count") is not None:
                      offenders.append(path)
                      break

          if offenders:
              print("Error: the following notebooks have saved outputs committed:")
              for path in offenders:
                  print(f"  {path}")
              print("")
              print("Strip outputs before committing:")
              print("")
              print("  jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace <notebook.ipynb>")
              print("")
              print("Or install the pre-commit hooks, see the Quick start section of CONTRIBUTING.md.")
              sys.exit(1)
          PY

  conventional-commits:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      # The merge commit takes the PR title, so that is what Release Please reads.
      - name: Fail if the pull request title is not a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | npx commitlint --verbose; then
            echo ""
            echo "The pull request title becomes the merge commit subject on master."
            echo "Use a conventional commit subject, for example:"
            echo ""
            echo "  fix: correct node voltage initialization in DiakopticsSolver"
            echo ""
            exit 1
          fi

      - name: Fail if a commit in this branch is not a conventional commit
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          if ! npx commitlint --from "$BASE" --to "$HEAD" --verbose; then
            echo ""
            echo "Rewrite the offending commit messages, then force-push:"
            echo ""
            echo "  git rebase -i $BASE"
            echo "  git push --force-with-lease"
            echo ""
            echo "Or install the pre-commit hooks (see CONTRIBUTING.md) to catch this locally."
            exit 1
          fi
