name: Container

# manually trigger workflow since it takes very long
on: workflow_dispatch

jobs:
  create-docker-rocky:
    runs-on: sogno-platform-dpsim-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        id: docker_build_dev_rocky
        uses: docker/build-push-action@v7
        with:
         file: packaging/Docker/Dockerfile.dev-rocky
         push: true
         tags: sogno/dpsim:dev-rocky

  create-docker-fedora-release:
    needs: create-docker-fedora-dev
    runs-on: sogno-platform-dpsim-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        id: docker_build_release
        uses: docker/build-push-action@v7
        with:
         file: packaging/Docker/Dockerfile
         push: true
         tags: sogno/dpsim:latest

  create-docker-fedora-dev:
    runs-on: sogno-platform-dpsim-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        id: docker_build_dev
        uses: docker/build-push-action@v7
        with:
         file: packaging/Docker/Dockerfile.dev
         push: true
         tags: sogno/dpsim:dev

  create-docker-fedora-minimal-dev:
    runs-on: sogno-platform-dpsim-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        id: docker_build_dev
        uses: docker/build-push-action@v7
        with:
         file: packaging/Docker/Dockerfile.dev-minimal
         push: true
         tags: sogno/dpsim:dev-minimal

  create-docker-manylinux:
    runs-on: sogno-platform-dpsim-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        id: docker_build_dev
        uses: docker/build-push-action@v7
        with:
         file: packaging/Docker/Dockerfile.manylinux
         push: true
         tags: sogno/dpsim:manylinux

  create-docker-binder:
    needs: create-docker-fedora-dev
    runs-on: sogno-platform-dpsim-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .binder/Dockerfile
          load: true
          push: false
          tags: sogno/dpsim:binder

      - name: Run test
        run: |
          mkdir -p logs
          sudo chown 1000:1000 logs
          docker run --rm \
            -u 1000:1000 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            sogno/dpsim:binder \
            python examples/villas/dpsim-file.py
    
      - name: Push
        run: |
          docker push sogno/dpsim:binder
