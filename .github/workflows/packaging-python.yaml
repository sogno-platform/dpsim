name: Packaging (Python)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Revision under test'
        required: true
        type: string
      version:
        description: 'Version to set in the pyproject.toml'
        required: false
        type: string
        default: ''
      image:
        description: 'Development image the source distribution is built in'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    container: ${{ inputs.image }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}
        allow-unsafe-pr-checkout: true
        submodules: recursive

    - name: Set the version resolved by the caller
      if: inputs.version != ''
      shell: bash
      run: python3 scripts/set_dev_version.py pyproject.toml ${{ inputs.version }}

    - name: Build DPsim source distribution
      shell: bash
      run: python3 -m build --sdist --outdir dist/

    - name: Archive Python source distribution
      uses: actions/upload-artifact@v7
      with:
        name: dist-source
        path: dist/

  build-wheels:
    name: Python wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: [cp310, cp311, cp312, cp313, cp314]
        include:
        - os: ubuntu-24.04
          platform: manylinux_x86_64
        - os: windows-latest
          platform: win_amd64
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}
        allow-unsafe-pr-checkout: true
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Set the version resolved by the caller
      if: "!startsWith(github.ref, 'refs/tags')"
      shell: bash
      run: python scripts/set_dev_version.py pyproject.toml ${{ inputs.version }}

    - name: Build wheel
      uses: pypa/cibuildwheel@v3.4.1
      env:
        CIBW_BUILD: "${{ matrix.python }}-${{ matrix.platform }}"
      with:
        output-dir: dist

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist-wheels-${{ matrix.python }}-${{ matrix.platform }}
        path: dist/
