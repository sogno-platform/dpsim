name: Prepare Images (fork)

# The fork-pr approval is the only gate in front of a privileged run of fork code.

on:
  pull_request_target:
    paths:
      - 'packaging/Docker/**'
      - 'packaging/Shell/**'
      - '.binder/Dockerfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Approve building images from a fork
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: fork-pr
    outputs:
      ref: ${{ steps.images.outputs.ref }}
      tag: ${{ steps.images.outputs.tag }}
      image_prefix: ${{ steps.images.outputs.prefix }}
      base_images: ${{ steps.images.outputs.base }}
      derived_images: ${{ steps.images.outputs.derived }}
      base_image: ${{ steps.images.outputs.dev }}
    steps:
      - name: Detect changed image definitions
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'packaging/Shell/**'
            dev: &dev
              - *shared
              - 'packaging/Docker/Dockerfile.dev'
            rocky:
              - *shared
              - 'packaging/Docker/Dockerfile.dev-rocky'
            minimal:
              - *shared
              - 'packaging/Docker/Dockerfile.dev-minimal'
            manylinux:
              - *shared
              - 'packaging/Docker/Dockerfile.manylinux'
            release:
              - *dev
              - 'packaging/Docker/Dockerfile'
            binder:
              - *dev
              - '.binder/Dockerfile'

      - name: Resolve the images to build
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          DEV: ${{ steps.filter.outputs.dev }}
          ROCKY: ${{ steps.filter.outputs.rocky }}
          MINIMAL: ${{ steps.filter.outputs.minimal }}
          MANYLINUX: ${{ steps.filter.outputs.manylinux }}
          RELEASE: ${{ steps.filter.outputs.release }}
          BINDER: ${{ steps.filter.outputs.binder }}
        run: |
          prefix="ghcr.io/${OWNER,,}/dpsim"

          queue() {
            jq -nc --argjson acc "$1" --arg image "$2" --arg file "$3" '$acc + [{image: $image, file: $file}]'
          }

          base='[]'
          derived='[]'
          if [ "$DEV" = "true" ]; then base=$(queue "$base" dev packaging/Docker/Dockerfile.dev); fi
          if [ "$ROCKY" = "true" ]; then base=$(queue "$base" dev-rocky packaging/Docker/Dockerfile.dev-rocky); fi
          if [ "$MINIMAL" = "true" ]; then base=$(queue "$base" dev-minimal packaging/Docker/Dockerfile.dev-minimal); fi
          if [ "$MANYLINUX" = "true" ]; then base=$(queue "$base" manylinux packaging/Docker/Dockerfile.manylinux); fi
          if [ "$RELEASE" = "true" ]; then derived=$(queue "$derived" release packaging/Docker/Dockerfile); fi
          if [ "$BINDER" = "true" ]; then derived=$(queue "$derived" binder .binder/Dockerfile); fi

          if [ "$DEV" = "true" ]; then dev="$prefix/dev:$SHA"; else dev="sogno/dpsim:dev"; fi

          {
            echo "ref=$SHA"
            echo "tag=$NUMBER-merge"
            echo "prefix=$prefix"
            echo "base=$base"
            echo "derived=$derived"
            echo "dev=$dev"
          } >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare Images
    needs: [gate]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-images.yaml
    with:
      ref: ${{ needs.gate.outputs.ref }}
      tag: ${{ needs.gate.outputs.tag }}
      image_prefix: ${{ needs.gate.outputs.image_prefix }}
      base_images: ${{ needs.gate.outputs.base_images }}
      derived_images: ${{ needs.gate.outputs.derived_images }}
      base_image: ${{ needs.gate.outputs.base_image }}
