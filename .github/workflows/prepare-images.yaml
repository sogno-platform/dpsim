name: Prepare Images

on:
  workflow_call:
    inputs:
      ref:
        description: 'Revision to build the images from'
        required: true
        type: string
      tag:
        description: 'Slugified name of the revision under test'
        required: true
        type: string
      image_prefix:
        description: 'Registry path the images are pushed to'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  base:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dev
            file: packaging/Docker/Dockerfile.dev
          - image: dev-rocky
            file: packaging/Docker/Dockerfile.dev-rocky
          - image: dev-minimal
            file: packaging/Docker/Dockerfile.dev-minimal
          - image: manylinux
            file: packaging/Docker/Dockerfile.manylinux
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}
          tags: |
            ${{ inputs.image_prefix }}/${{ matrix.image }}:${{ inputs.ref }}
            ${{ inputs.image_prefix }}/${{ matrix.image }}:${{ inputs.tag }}

  derived:
    name: Build ${{ matrix.image }} image
    needs: [base]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: release
            file: packaging/Docker/Dockerfile
          - image: binder
            file: .binder/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            BASE_IMAGE=${{ inputs.image_prefix }}/dev:${{ inputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}
          tags: |
            ${{ inputs.image_prefix }}/${{ matrix.image }}:${{ inputs.ref }}
            ${{ inputs.image_prefix }}/${{ matrix.image }}:${{ inputs.tag }}
