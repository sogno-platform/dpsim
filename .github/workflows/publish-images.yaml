name: Publish Images

on:
  push:
    branches:
      - master
    paths:
      - 'packaging/Docker/**'
      - 'packaging/Shell/**'
      - '.binder/Dockerfile'
  workflow_dispatch:
    inputs:
      image:
        description: Image to build and publish
        type: choice
        required: true
        default: all
        options:
          - all
          - dev
          - dev-rocky
          - dev-minimal
          - manylinux
          - latest
          - binder

permissions:
  contents: read

jobs:
  base:
    name: Publish sogno/dpsim:${{ matrix.image }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || contains(fromJSON('["dev", "dev-rocky", "dev-minimal", "manylinux"]'), inputs.image) }}
    runs-on: sogno-platform-dpsim-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dev
            file: packaging/Docker/Dockerfile.dev
          - image: dev-rocky
            file: packaging/Docker/Dockerfile.dev-rocky
          - image: dev-minimal
            file: packaging/Docker/Dockerfile.dev-minimal
          - image: manylinux
            file: packaging/Docker/Dockerfile.manylinux
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: sogno/dpsim:${{ matrix.image }}

  derived:
    name: Publish sogno/dpsim:${{ matrix.image }}
    needs: [base]
    if: ${{ always() && needs.base.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.image == 'all' || contains(fromJSON('["latest", "binder"]'), inputs.image)) }}
    runs-on: sogno-platform-dpsim-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: latest
            file: packaging/Docker/Dockerfile
          - image: binder
            file: .binder/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            BASE_IMAGE=sogno/dpsim:dev
          tags: sogno/dpsim:${{ matrix.image }}
