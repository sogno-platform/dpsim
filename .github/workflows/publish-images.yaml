name: Publish Images

on:
  push:
    branches:
      - master
    paths:
      - 'packaging/Docker/**'
      - 'packaging/Shell/**'
      - '.binder/Dockerfile'
  workflow_dispatch:
    inputs:
      image:
        description: Image to build and publish
        type: choice
        required: true
        default: all
        options:
          - all
          - dev
          - dev-vscode
          - dev-rocky
          - dev-minimal
          - manylinux
          - latest
          - binder

permissions:
  contents: read

jobs:
  changes:
    name: Resolve the images to publish
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.images.outputs.base }}
      derived: ${{ steps.images.outputs.derived }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed image definitions
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'packaging/Shell/**'
            dev: &dev
              - *shared
              - 'packaging/Docker/Dockerfile.dev'
            rocky:
              - *shared
              - 'packaging/Docker/Dockerfile.dev-rocky'
            minimal:
              - *shared
              - 'packaging/Docker/Dockerfile.dev-minimal'
            manylinux:
              - *shared
              - 'packaging/Docker/Dockerfile.manylinux'
            latest:
              - *dev
              - 'packaging/Docker/Dockerfile'
            binder:
              - *dev
              - '.binder/Dockerfile'

      - name: Resolve the images to publish
        id: images
        env:
          SELECTED: ${{ inputs.image }}
          DEV: ${{ steps.filter.outputs.dev }}
          ROCKY: ${{ steps.filter.outputs.rocky }}
          MINIMAL: ${{ steps.filter.outputs.minimal }}
          MANYLINUX: ${{ steps.filter.outputs.manylinux }}
          LATEST: ${{ steps.filter.outputs.latest }}
          BINDER: ${{ steps.filter.outputs.binder }}
        run: |
          wanted() {
            if [ -n "$SELECTED" ]; then
              [ "$SELECTED" = "all" ] || [ "$SELECTED" = "$1" ]
            else
              [ "$2" = "true" ]
            fi
          }

          queue() {
            jq -nc --argjson acc "$1" --arg image "$2" --arg file "$3" --arg target "${4-}" '$acc + [{image: $image, file: $file, target: $target}]'
          }

          base='[]'
          derived='[]'
          if wanted dev "$DEV"; then base=$(queue "$base" dev packaging/Docker/Dockerfile.dev); fi
          if wanted dev-vscode "$DEV"; then base=$(queue "$base" dev-vscode packaging/Docker/Dockerfile.dev dev-vscode); fi
          if wanted dev-rocky "$ROCKY"; then base=$(queue "$base" dev-rocky packaging/Docker/Dockerfile.dev-rocky); fi
          if wanted dev-minimal "$MINIMAL"; then base=$(queue "$base" dev-minimal packaging/Docker/Dockerfile.dev-minimal); fi
          if wanted manylinux "$MANYLINUX"; then base=$(queue "$base" manylinux packaging/Docker/Dockerfile.manylinux); fi
          if wanted latest "$LATEST"; then derived=$(queue "$derived" latest packaging/Docker/Dockerfile); fi
          if wanted binder "$BINDER"; then derived=$(queue "$derived" binder .binder/Dockerfile); fi

          {
            echo "base=$base"
            echo "derived=$derived"
          } >> "$GITHUB_OUTPUT"

  base:
    name: Publish sogno/dpsim:${{ matrix.image }}
    needs: [changes]
    if: needs.changes.outputs.base != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.base) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: sogno/dpsim:${{ matrix.image }}

  derived:
    name: Publish sogno/dpsim:${{ matrix.image }}
    needs: [changes, base]
    if: ${{ always() && needs.base.result != 'failure' && needs.changes.outputs.derived != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.derived) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          build-args: |
            BASE_IMAGE=sogno/dpsim:dev
          tags: sogno/dpsim:${{ matrix.image }}
