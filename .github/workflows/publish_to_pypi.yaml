name: Publish to PyPI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version string
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0)
            VERSION="${LATEST_TAG}.dev${{ github.run_number }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    name: Packaging
    needs: [version]
    uses: ./.github/workflows/packaging-python.yaml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      image: sogno/dpsim:dev

  publish-testpypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    needs: [version,build]
    if: github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-rc')
    steps:
    - name: Download wheels from build jobs
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution to Test PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags') && !contains(github.ref, '-rc')
    environment: pypi
    permissions:
      id-token: write
    needs: [build]

    steps:
    - name: Download wheels from build jobs
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.0
