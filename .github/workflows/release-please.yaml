name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: master

      # A tag pushed with GITHUB_TOKEN starts no workflow run, but a dispatch always does.
      - name: Publish the tag that was just created
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish_to_pypi.yaml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"

      # A release changes none of the image definitions, so the path filter never fires.
      - name: Rebuild the release image
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish-images.yaml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" --field image=latest
