# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # LICENSES/ is kept as SPDX publishes it, trailing space in MPL-2.0 included.
      - id: trailing-whitespace
        exclude: ^LICENSES/
      - id: end-of-file-fixer
        exclude: \.svg$|^LICENSES/
      - id: check-ast
      - id: check-xml
      - id: check-yaml
      - id: check-json
        # devcontainer.json contains comments
        exclude: .devcontainer/devcontainer\.json
      - id: check-toml
      - id: check-added-large-files
      - id: pretty-format-json
        # black has its own mind of formatting Jupyter notebooks
        exclude: \.ipynb$|^.devcontainer/devcontainer\.json$|package-lock\.json$
        args:
          - --no-sort-keys
          - --autofix

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v17.0.6"
    hooks:
      - id: clang-format
        files: \.(c|cpp|h|hpp)(\.in)?$
        args: []

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "2.7.3"
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-indent-size]

  # Using this mirror lets us use mypyc-compiled black, which is about 2x faster
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: "25.11.0"
    hooks:
      - id: black
      - id: black-jupyter

  - repo: https://github.com/markdownlint/markdownlint
    rev: "v0.13.0"
    hooks:
      - id: markdownlint
        args: [-r, "~MD013,~MD033,~MD024"]
        exclude: ^docs/hugo/content/
      # Hugo emits the <h1> from the page front matter, so a top level header in the
      # body would render a second one. MD002 is therefore dropped for content pages only.
      - id: markdownlint
        name: Markdownlint (Hugo content)
        args: [-r, "~MD013,~MD033,~MD024,~MD002"]
        files: ^docs/hugo/content/.*\.md$
        types: [markdown]

  - repo: local
    hooks:
      - id: clear-notebook-outputs
        name: clear notebook outputs
        language: python
        additional_dependencies: ["nbconvert==7.17.1"]
        entry: python -m nbconvert --ClearOutputPreprocessor.enabled=True --inplace
        files: \.ipynb$

  # Same version as the reuse workflow. Needs pre-commit on Python 3.10+.
  - repo: https://github.com/fsfe/reuse-tool
    rev: "v6.2.0"
    hooks:
      # Only the files a commit touches; the reuse workflow lints the full tree.
      - id: reuse-lint-file
