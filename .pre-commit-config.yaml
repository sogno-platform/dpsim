# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# commitlint runs at commit-msg, so plain `pre-commit install` must wire that stage too.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-ast
      - id: check-xml
      - id: check-yaml
      - id: check-json
        # devcontainer.json contains comments
        exclude: .devcontainer/devcontainer\.json
      - id: check-toml
      - id: check-added-large-files
      - id: pretty-format-json
        # black has its own mind of formatting Jupyter notebooks
        exclude: \.ipynb$|^.devcontainer/devcontainer\.json$|package-lock\.json$
        args:
          - --no-sort-keys
          - --autofix

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v17.0.6"
    hooks:
      - id: clang-format
        files: \.(c|cpp|h|hpp)(\.in)?$
        args: []

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "2.7.3"
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-indent-size]

  # Using this mirror lets us use mypyc-compiled black, which is about 2x faster
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: "25.11.0"
    hooks:
      - id: black
      - id: black-jupyter

  - repo: https://github.com/markdownlint/markdownlint
    rev: "v0.13.0"
    hooks:
      - id: markdownlint
        args: [-r, "~MD013,~MD033,~MD024"]
        exclude: ^docs/hugo/content/
      # Hugo emits the <h1> from the page front matter, so a top level header in the
      # body would render a second one. MD002 is therefore dropped for content pages only.
      - id: markdownlint
        name: Markdownlint (Hugo content)
        args: [-r, "~MD013,~MD033,~MD024,~MD002"]
        files: ^docs/hugo/content/.*\.md$
        types: [markdown]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: "v9.26.0"
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@19.8.1"]

  - repo: local
    hooks:
      - id: clear-notebook-outputs
        name: clear notebook outputs
        language: python
        additional_dependencies: ["nbconvert==7.17.1"]
        entry: python -m nbconvert --ClearOutputPreprocessor.enabled=True --inplace
        files: \.ipynb$
