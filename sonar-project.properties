sonar.projectKey=sogno-platform_dpsim
sonar.organization=sogno-platform

# Cpp analysis settings
sonar.host.url=https://sonarcloud.io
sonar.cfamily.analysisCache.path=sonar-cache
sonar.cfamily.analysisCache.mode=fs

# Sonar Python Version
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Patterns excluded from duplication detection
sonar.cpd.exclusions=dpsim/examples/**/*,examples/**/*

# cpp:S5184 targets unnamed RAII temporaries, but the bindings hold no resource: py::class_<T>(mod, "T") registers the type as a constructor side effect.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S5184
sonar.issue.ignore.multicriteria.e1.resourceKey=dpsim/src/pybind/**

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=DPsim
# x-release-please-start-version
sonar.projectVersion=1.5.0
# x-release-please-end

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
